# Fix some dragging issues with XWayland
windowrule {
    name = xwayland-drag-fix
    match:class = ^$
    match:title = ^$
    match:xwayland = 1
    match:float = 1
    match:fullscreen = 0
    match:pin = 0
    fullscreen_state = 0
}

# --- STAS STUFF ---

# Transparency settings
windowrule = match:initial_class ^brave-browser$, opacity 0.9 0.85
windowrule = match:initial_class ^discord$, opacity 0.85 0.75
windowrule = match:initial_class ^[S|s]potify$, opacity 0.75 0.65
windowrule = match:initial_class ^com.github.wwmm.easyeffects$, opacity 0.75 0.65
windowrule = match:initial_class ^Code$, opacity 0.8 0.7
windowrule = match:initial_class ^obsidian$, opacity 0.8 0.7
windowrule = match:initial_class ^anki$, opacity 0.8 0.7

# Default monitors, workspaces, and grouped rules
windowrule {
    name = discord-transparency
    match:initial_class = ^discord$
    monitor = DP-4
    workspace = 2
}

windowrule = match:initial_class ^Spotify$, workspace 3

# Floating windows and their stuff
windowrule {
    name = display-float
    match:initial_class = ^nwg-displays$
    float = on
    center = on
}

windowrule {
    name = feh-float
    match:initial_class = ^feh$
    float = on
    keep_aspect_ratio = on
}

windowrule = match:title ^(Sign in to your account.*)$, float on
